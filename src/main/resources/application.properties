spring.application.name=hanyunjing
server.port=8082
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=5MB
server.error.include-message=never
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
app.llm.enabled=${LLM_ENABLED:true}
app.llm.api-key=${OPENAI_API_KEY:}
app.llm.base-url=${OPENAI_BASE_URL:https://api.openai-next.com/v1}
app.llm.model=${OPENAI_MODEL:gpt-6.1-sol}
app.portrait.ttl-minutes=30
app.catalogue.expansion-enabled=${CATALOGUE_EXPANSION_ENABLED:false}

spring.config.import=optional:file:./.local/agent.properties,optional:file:./.local/tryon.properties,optional:file:./.local/database.properties,optional:file:./.local/orbit.properties

# A real, persistent SQL database. Override these settings for MySQL 8+.
spring.datasource.url=${DB_URL:jdbc:h2:file:./.local/database/hanyunjing;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.h2.console.enabled=false
app.admin.setup-token-file=.local/admin-setup-token.txt
app.tryon.enabled=${TRYON_ENABLED:false}
app.tryon.volcengine.access-key=${VOLCENGINE_ACCESS_KEY:}
app.tryon.volcengine.secret-key=${VOLCENGINE_SECRET_KEY:}
app.tryon.timeout-seconds=600
app.orbit.enabled=${HUNYUAN_3D_ENABLED:false}
app.orbit.tencent.secret-id=${TENCENTCLOUD_SECRET_ID:}
app.orbit.tencent.secret-key=${TENCENTCLOUD_SECRET_KEY:}
app.orbit.tencent.region=${HUNYUAN_3D_REGION:ap-guangzhou}
app.orbit.tencent.model=${HUNYUAN_3D_MODEL:3.0}
app.orbit.timeout-seconds=900
